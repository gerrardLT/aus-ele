# 生产环境编排文件：按 IMAGE_TAG 拉取 GHCR 预构建镜像（不在生产机本地构建）。
# 镜像引用：${REGISTRY}/${IMAGE_PREFIX}/<service>:${IMAGE_TAG}
# 运行时变量由服务器侧 /www/wwwroot/aus-ele/.env.prod 提供（chmod 600，不纳入仓库追踪）。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      POSTGRES_DB: aemo_data
      POSTGRES_USER: aemo
      POSTGRES_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aemo -d aemo_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    restart: unless-stopped
    # OOM 修复（2026-08-09）：此前 1200m + 4 worker，重工具波次（CBC/Monte Carlo）
    # 撑爆 cgroup 被 OOM kill（dmesg 实证）。单 worker（async 模型下并发靠
    # 事件循环+线程池，足够）+ 降采样后内存余量充足，1500m 为兜底。
    mem_limit: 1500m
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      AUS_ELE_DB_BACKEND: postgresql
      AUS_ELE_PG_HOST: postgres
      AUS_ELE_PG_PORT: 5432
      AUS_ELE_PG_DATABASE: aemo_data
      AUS_ELE_PG_USER: aemo
      AUS_ELE_PG_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
      AUS_ELE_PG_MAX_CONNECTIONS: 10
      AUS_ELE_ENABLE_SCHEDULER: ${AUS_ELE_ENABLE_SCHEDULER:-false}
      AUS_ELE_ENABLE_JOB_WORKER: ${AUS_ELE_ENABLE_JOB_WORKER:-false}
      AUS_ELE_RECONCILIATION_ENABLED: ${AUS_ELE_RECONCILIATION_ENABLED:-false}
      AUS_ELE_CORS_ALLOW_ORIGINS: ${AUS_ELE_CORS_ALLOW_ORIGINS:-http://localhost:${WEB_HOST_PORT:-18080},http://127.0.0.1:${WEB_HOST_PORT:-18080}}
      AUS_ELE_CORS_ALLOW_CREDENTIALS: ${AUS_ELE_CORS_ALLOW_CREDENTIALS:-false}
      AUS_ELE_JWT_SECRET: ${AUS_ELE_JWT_SECRET:?AUS_ELE_JWT_SECRET is required}
      AUS_ELE_WEB_BOOTSTRAP_SECRET: ${AUS_ELE_WEB_BOOTSTRAP_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FINGRID_BASE_URL: ${FINGRID_BASE_URL:-https://data.fingrid.fi/api}
      FINGRID_REQUEST_INTERVAL_SECONDS: ${FINGRID_REQUEST_INTERVAL_SECONDS:-6.5}
      FINGRID_TIMEOUT_SECONDS: ${FINGRID_TIMEOUT_SECONDS:-30}
      FINGRID_DEFAULT_BACKFILL_START: ${FINGRID_DEFAULT_BACKFILL_START:-2014-01-01T00:00:00Z}
      FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS: ${FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS:-30}
      # AI Agent LLM (optional — template mode when key is empty)
      AUS_ELE_AGENT_LLM_PROVIDER: ${AUS_ELE_AGENT_LLM_PROVIDER:-openai}
      AUS_ELE_AGENT_LLM_API_KEY: ${AUS_ELE_AGENT_LLM_API_KEY:-}
      AUS_ELE_AGENT_LLM_BASE_URL: ${AUS_ELE_AGENT_LLM_BASE_URL:-}
      AUS_ELE_AGENT_LLM_MODEL: ${AUS_ELE_AGENT_LLM_MODEL:-gpt-4o}
      # P2 邮件渠道（2026-08-14）：值由服务器侧 .env.prod 提供；缺失时告警自动降级仅站内
      AGENT_ALERT_SMTP_HOST: ${AGENT_ALERT_SMTP_HOST:-}
      AGENT_ALERT_SMTP_PORT: ${AGENT_ALERT_SMTP_PORT:-465}
      AGENT_ALERT_SMTP_USE_TLS: ${AGENT_ALERT_SMTP_USE_TLS:-false}
      AGENT_ALERT_SMTP_USER: ${AGENT_ALERT_SMTP_USER:-}
      AGENT_ALERT_SMTP_PASSWORD: ${AGENT_ALERT_SMTP_PASSWORD:-}
      AGENT_ALERT_SMTP_FROM: ${AGENT_ALERT_SMTP_FROM:-}
      FEEDBACK_TO: ${FEEDBACK_TO:-}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
      - ./reports:/app/reports
      - ./scripts:/app/scripts
      - ${WEM_RAW_DATA_DIR:-/www/wwwroot/wem_raw_data}:/app/wem_raw_data:ro
    ports:
      - "${API_HOST_PORT:-18085}:8085"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      AUS_ELE_DB_BACKEND: postgresql
      AUS_ELE_PG_HOST: postgres
      AUS_ELE_PG_PORT: 5432
      AUS_ELE_PG_DATABASE: aemo_data
      AUS_ELE_PG_USER: aemo
      AUS_ELE_PG_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
      AUS_ELE_PG_MAX_CONNECTIONS: 10
      AUS_ELE_ENABLE_SCHEDULER: ${AUS_ELE_WORKER_ENABLE_SCHEDULER:-true}
      AUS_ELE_ENABLE_JOB_WORKER: ${AUS_ELE_WORKER_ENABLE_JOB_WORKER:-true}
      AUS_ELE_RECONCILIATION_ENABLED: ${AUS_ELE_RECONCILIATION_ENABLED:-false}
      AUS_ELE_CORS_ALLOW_ORIGINS: ${AUS_ELE_CORS_ALLOW_ORIGINS:-http://localhost:${WEB_HOST_PORT:-18080},http://127.0.0.1:${WEB_HOST_PORT:-18080}}
      AUS_ELE_CORS_ALLOW_CREDENTIALS: ${AUS_ELE_CORS_ALLOW_CREDENTIALS:-false}
      AUS_ELE_JWT_SECRET: ${AUS_ELE_JWT_SECRET:?AUS_ELE_JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      # P2 邮件渠道（2026-08-14）：worker 侧告警评估也需要
      AGENT_ALERT_SMTP_HOST: ${AGENT_ALERT_SMTP_HOST:-}
      AGENT_ALERT_SMTP_PORT: ${AGENT_ALERT_SMTP_PORT:-465}
      AGENT_ALERT_SMTP_USE_TLS: ${AGENT_ALERT_SMTP_USE_TLS:-false}
      AGENT_ALERT_SMTP_USER: ${AGENT_ALERT_SMTP_USER:-}
      AGENT_ALERT_SMTP_PASSWORD: ${AGENT_ALERT_SMTP_PASSWORD:-}
      AGENT_ALERT_SMTP_FROM: ${AGENT_ALERT_SMTP_FROM:-}
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FINGRID_BASE_URL: ${FINGRID_BASE_URL:-https://data.fingrid.fi/api}
      FINGRID_REQUEST_INTERVAL_SECONDS: ${FINGRID_REQUEST_INTERVAL_SECONDS:-6.5}
      FINGRID_TIMEOUT_SECONDS: ${FINGRID_TIMEOUT_SECONDS:-30}
      FINGRID_DEFAULT_BACKFILL_START: ${FINGRID_DEFAULT_BACKFILL_START:-2014-01-01T00:00:00Z}
      FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS: ${FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS:-30}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX}/web:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "${WEB_HOST_PORT:-18080}:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"

volumes:
  redis_data:
  pg_data:

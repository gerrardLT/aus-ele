<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>澳洲电力市场分析平台 · 技术全景信息图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#1E293B;-webkit-font-smoothing:antialiased}
.diagram-root{width:1440px;margin:0 auto;overflow:hidden}
/* === Sticky Navigation === */
.sticky-nav{position:sticky;top:0;z-index:100;background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 60px;display:flex;align-items:center;height:48px;gap:8px}
.nav-logo{font-size:13px;font-weight:700;color:#fff;margin-right:16px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav-logo-dot{width:8px;height:8px;border-radius:50%;background:#3B82F6;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
.nav-link{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.55);cursor:pointer;transition:all 0.2s;text-decoration:none;white-space:nowrap;border:1px solid transparent}
.nav-link:hover{color:rgba(255,255,255,0.9);background:rgba(255,255,255,0.08)}
.nav-link.active{color:#fff;background:rgba(59,130,246,0.25);border-color:rgba(59,130,246,0.4)}
.nav-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-btn{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);transition:all 0.2s}
.nav-btn:hover{background:rgba(255,255,255,0.12);color:#fff}
/* === Header === */
.infographic-header{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 50%,#1D4ED8 100%);padding:56px 60px 48px;position:relative;overflow:hidden}
.infographic-header::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='strict'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.header-badge{display:inline-block;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:4px 16px;font-size:12px;color:rgba(255,255,255,0.7);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
.header-title{font-size:38px;font-weight:800;color:#fff;letter-spacing:-0.5px;margin-bottom:10px}
.header-subtitle{font-size:16px;color:rgba(255,255,255,0.6);font-weight:400;max-width:700px;line-height:1.7}
.header-meta{display:flex;gap:24px;margin-top:24px;flex-wrap:wrap}
.header-meta-item{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,0.5)}
.header-meta-dot{width:8px;height:8px;border-radius:50%}
/* === Sections === */
.section-container{padding:44px 60px;position:relative;scroll-margin-top:48px}
.section-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;cursor:pointer;user-select:none}
.section-number{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;transition:transform 0.2s}
.section-header:hover .section-number{transform:scale(1.08)}
.section-title{font-size:22px;font-weight:700;color:#0F172A;letter-spacing:-0.3px}
.section-title-en{font-size:13px;color:#94A3B8;font-weight:500;margin-top:2px}
.section-toggle{width:32px;height:32px;border-radius:8px;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:all 0.2s}
.section-toggle:hover{background:#F1F5F9;border-color:#CBD5E1}
.expand-content{overflow:hidden;transition:max-height 0.45s cubic-bezier(0.4,0,0.2,1),opacity 0.3s ease}
.expand-content.collapsed{max-height:0!important;opacity:0}
.expand-content.expanded{max-height:12000px;opacity:1}
.section-divider{height:1px;background:linear-gradient(90deg,transparent,#E2E8F0 20%,#E2E8F0 80%,transparent);margin:0 60px}
/* === Formula & Algo === */
.formula-block{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:14px 18px;margin:10px 0;font-size:14px;transition:border-color 0.2s}
.formula-block:hover{border-color:#CBD5E1}
.formula-label{font-size:11px;font-weight:600;color:#64748B;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.algo-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:12px;overflow:hidden;transition:box-shadow 0.2s}
.algo-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.04)}
.algo-header{display:flex;align-items:center;gap:14px;padding:16px 24px;cursor:pointer;user-select:none}
.algo-header:hover{background:#FAFBFC}
.algo-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.algo-name{font-size:15px;font-weight:600;color:#0F172A}
.algo-name-en{font-size:12px;color:#94A3B8;font-weight:400;margin-left:8px}
.algo-body{padding:0 24px 20px;border-top:1px solid #F1F5F9}
/* === Engine === */
.engine-category{background:#fff;border:1px solid #E2E8F0;border-radius:12px;margin-bottom:12px;overflow:hidden;transition:box-shadow 0.2s}
.engine-category:hover{box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.engine-cat-header{display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;transition:background 0.15s}
.engine-cat-header:hover{background:#F8FAFC}
.engine-cat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.engine-cat-title{font-size:14px;font-weight:600;color:#0F172A}
.engine-cat-count{font-size:12px;color:#94A3B8;margin-left:auto}
.engine-list{padding:0 20px 14px;display:flex;flex-wrap:wrap;gap:8px}
.engine-file{display:flex;align-items:center;gap:6px;padding:4px 12px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;font-size:12px;font-family:'SF Mono','Fira Code',monospace;color:#475569;transition:all 0.15s}
.engine-file:hover{background:#EFF6FF;border-color:#93C5FD}
.engine-file-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.katex{font-size:1em!important}
.formula-block .katex{font-size:1.05em!important}
/* === Footer === */
.info-footer{padding:32px 60px;background:#0F172A;color:rgba(255,255,255,0.5);font-size:12px;display:flex;justify-content:space-between;align-items:center}
.footer-links{display:flex;gap:20px}
/* === Scroll progress === */
.scroll-progress{position:fixed;top:48px;left:0;height:2px;background:linear-gradient(90deg,#1D4ED8,#7C3AED,#C2410C);z-index:99;transition:width 0.1s}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

/* ── Color Tokens ── */
const NEM_BLUE='#1D4ED8',NEM_BLUE_LIGHT='#3B82F6',NEM_BLUE_BG='#EFF6FF';
const WEM_ORANGE='#C2410C',WEM_ORANGE_LIGHT='#EA580C',WEM_ORANGE_BG='#FFF7ED';

/* ── Primitives ── */
const ChevronDown=({open})=>(
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
    style={{transition:'transform 0.3s',transform:open?'rotate(180deg)':'rotate(0deg)'}}>
    <polyline points="6 9 12 15 18 9"/>
  </svg>
);

const K=({math,display=false})=>{
  const ref=useRef(null);
  useEffect(()=>{
    if(ref.current&&window.katex){
      try{window.katex.render(math,ref.current,{displayMode:display,throwOnError:false})}
      catch(e){ref.current.textContent=math}
    }
  },[math,display]);
  return <span ref={ref}/>;
};

const FormulaBlock=({label,children})=>(
  <div className="formula-block">
    <div className="formula-label">{label}</div>
    <div>{children}</div>
  </div>
);

/* ── Section Wrapper ── */
const Section=({num,title,titleEn,color,children,defaultOpen=true,id})=>{
  const[open,setOpen]=useState(defaultOpen);
  return(
    <div className="section-container" id={id}>
      <div className="section-header" onClick={()=>setOpen(!open)}>
        <div className="section-number" style={{background:color}}>{num}</div>
        <div>
          <div className="section-title">{title}</div>
          <div className="section-title-en">{titleEn}</div>
        </div>
        <div className="section-toggle" style={{marginLeft:'auto'}}>
          <ChevronDown open={open}/>
        </div>
      </div>
      <div className={'expand-content '+(open?'expanded':'collapsed')}>
        {children}
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════
   Section 1: 业务逻辑链 Truth → Forecast → Decision
   ══════════════════════════════════════════════════ */
const Section1=()=>{
  const[expanded,setExpanded]=useState({current:false,outlook:false,bess:false});
  const toggle=(k)=>setExpanded(p=>({...p,[k]:!p[k]}));

  const LayerCard=({title,color,bgColor,items,expandKey,details})=>(
    <div style={{flex:1}}>
      <div style={{background:bgColor,border:'2px solid '+color,borderRadius:12,padding:'18px 20px',cursor:'pointer'}} onClick={()=>toggle(expandKey)}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:color}}/>
          <span style={{fontSize:15,fontWeight:700,color}}>{title}</span>
          <span style={{marginLeft:'auto'}}><ChevronDown open={expanded[expandKey]}/></span>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {items.map((item,i)=><span key={i} style={{padding:'3px 10px',background:'#fff',border:'1px solid '+color+'33',borderRadius:6,fontSize:12,color:'#334155',fontWeight:500}}>{item}</span>)}
        </div>
      </div>
      <div className={'expand-content '+(expanded[expandKey]?'expanded':'collapsed')}>
        <div style={{padding:'12px 4px 0',fontSize:13,color:'#475569',lineHeight:1.7}}>{details}</div>
      </div>
    </div>
  );

  return(
    <div>
      {/* SVG Flow Arrow */}
      <svg width="1320" height="80" viewBox="0 0 1320 80" style={{display:'block',margin:'0 auto 24px'}}>
        <defs><marker id="ab1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill={NEM_BLUE}/></marker></defs>
        <rect x="20" y="10" width="360" height="60" rx="10" fill="#EFF6FF" stroke={NEM_BLUE} strokeWidth="2"/>
        <text x="200" y="38" textAnchor="middle" fill={NEM_BLUE} fontSize="14" fontWeight="700">Truth — 当前市场真相</text>
        <text x="200" y="56" textAnchor="middle" fill="#64748B" fontSize="11">Current Market State</text>
        <line x1="390" y1="40" x2="470" y2="40" stroke={NEM_BLUE} strokeWidth="2" markerEnd="url(#ab1)"/>
        <text x="430" y="32" textAnchor="middle" fill="#94A3B8" fontSize="10">分析</text>
        <rect x="480" y="10" width="360" height="60" rx="10" fill="#EFF6FF" stroke={NEM_BLUE_LIGHT} strokeWidth="2"/>
        <text x="660" y="38" textAnchor="middle" fill={NEM_BLUE_LIGHT} fontSize="14" fontWeight="700">Forecast — 前瞻判断</text>
        <text x="660" y="56" textAnchor="middle" fill="#64748B" fontSize="11">24h Outlook & Prediction</text>
        <line x1="850" y1="40" x2="930" y2="40" stroke={WEM_ORANGE} strokeWidth="2" markerEnd="url(#ab1)"/>
        <text x="890" y="32" textAnchor="middle" fill="#94A3B8" fontSize="10">优化</text>
        <rect x="940" y="10" width="360" height="60" rx="10" fill="#FFF7ED" stroke={WEM_ORANGE} strokeWidth="2"/>
        <text x="1120" y="38" textAnchor="middle" fill={WEM_ORANGE} fontSize="14" fontWeight="700">Decision — 储能决策</text>
        <text x="1120" y="56" textAnchor="middle" fill="#64748B" fontSize="11">BESS Investment Decision</text>
      </svg>
      {/* Three Layer Cards */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:20}}>
        <LayerCard title="📊 当前市场真相层" color={NEM_BLUE} bgColor={NEM_BLUE_BG} expandKey="current"
          items={['PriceChartModule','RegimeCompactPanel','SummaryStats','DataQualityBadge']}
          details={<div>
            <p style={{marginBottom:8}}><strong>核心职责：</strong>实时呈现 NEM/WEM 市场价格、供需状态和 Regime 判定结果。</p>
            <p style={{marginBottom:4}}>• <strong>PriceChartModule</strong> — 30天价格主图，含 Spikes 标注、区域对比、FCAS 叠加</p>
            <p style={{marginBottom:4}}>• <strong>RegimeCompactPanel</strong> — 市场状态机（Bull/Bear/Volatile/Sideways），基于滚动窗口波动率和趋势判定</p>
            <p style={{marginBottom:4}}>• <strong>SummaryStats</strong> — 关键统计量：均价、峰谷差、波动率、价差套利空间</p>
            <p>• <strong>DataQualityBadge</strong> — 数据完整性评分，缺失/延迟/异常标注</p>
          </div>}/>
        <LayerCard title="🔮 前瞻判断层" color={NEM_BLUE_LIGHT} bgColor="#F0F7FF" expandKey="outlook"
          items={['GridForecast','PeakAnalysis','ChargingWindow']}
          details={<div>
            <p style={{marginBottom:8}}><strong>核心职责：</strong>基于历史模式和气象数据，预测未来 24-72 小时电网状态。</p>
            <p style={{marginBottom:4}}>• <strong>GridForecast</strong> — 主预测引擎，输出需求/价格/可再生能源占比的逐时段预测</p>
            <p style={{marginBottom:4}}>• <strong>PeakAnalysis</strong> — 峰值识别与分类（需求峰值 vs 价格峰值），标注概率和持续时间</p>
            <p>• <strong>ChargingWindow</strong> — 最优充电窗口识别，基于价格谷值和 SoC 约束计算</p>
          </div>}/>
        <LayerCard title="🔋 储能决策层" color={WEM_ORANGE} bgColor={WEM_ORANGE_BG} expandKey="bess"
          items={['P3BessDecisionPanel','FcasAnalysis','RevenueStacking','InvestmentAnalysis']}
          details={<div>
            <p style={{marginBottom:8}}><strong>核心职责：</strong>综合市场信号和物理约束，输出充放电策略和投资建议。</p>
            <p style={{marginBottom:4}}>• <strong>P3BessDecisionPanel</strong> — Phase 3 决策面板，整合 MILP 调度结果和衰减成本</p>
            <p style={{marginBottom:4}}>• <strong>FcasAnalysis</strong> — FCAS 叠加收益分析，含机会成本计算和触发概率</p>
            <p style={{marginBottom:4}}>• <strong>RevenueStacking</strong> — 收入叠加模型：套利 + FCAS + 容量信用 → 总收入栈</p>
            <p>• <strong>InvestmentAnalysis</strong> — 资本层：NPV/IRR/DSCR 计算，敏感性分析，情景对比</p>
          </div>}/>
      </div>
    </div>
  );
};

/* ══════════════════════════════════════════════════
   Section 2: 决策漏斗 NEM 7 + WEM 3
   ══════════════════════════════════════════════════ */
const Section2=()=>{
  const[openStep,setOpenStep]=useState(null);
  const toggle=(k)=>setOpenStep(p=>p===k?null:k);

  const nemStages=[
    {num:1,title:'市场筛选',en:'Opportunity Identification',color:'#1D4ED8',modules:['PriceChartModule','SummaryStatsModule','RegionalRanking'],desc:'扫描 5 个 NEM 区域（NSW1/QLD1/VIC1/SA1/TAS1），识别价差套利机会。基于历史价格分布和波动率排名，筛选出 Top-3 目标区域。'},
    {num:2,title:'收入深潜',en:'Market Opportunity',color:'#2563EB',modules:['SpikeProfitAnalysis'],desc:'对筛选出的区域进行价格尖峰分析，量化极端价格事件的利润贡献。计算 Spike 频率、幅度、持续时间和可捕获率。'},
    {num:3,title:'饱和与竞争',en:'Saturation & Competition',color:'#3B82F6',modules:['SaturationTracker'],desc:'评估目标区域的市场饱和度：已装机 BESS 容量、在建项目、grid connection 排队情况。判断市场窗口是否仍然开放。'},
    {num:4,title:'投资前景情景',en:'Investment Prospect Scenarios',color:'#60A5FA',modules:['CannibalizationSimulator','FcasCollapseForecaster','RegionalTimingScorer','MerchantRiskQuantifier','ForwardSpreadCurve'],desc:'多维度情景分析：蚕食效应模拟、FCAS 崩塌预测、区域时机评分、商户风险量化、远期价差曲线。综合输出投资前景评分。'},
    {num:5,title:'联合优化回测',en:'Co-Optimized Backtest',color:'#7C3AED',modules:['CoOptimizedBacktest'],desc:'运行联合优化回测引擎，同时优化套利和 FCAS 收入，考虑衰减约束和网络费用。输出历史表现基准线。'},
    {num:6,title:'财务建模',en:'Revenue Estimation',color:'#9333EA',modules:['RevenueStratificationChart','CrossValidationTable','EventAnnotationOverlay','FuelSensitivityTable','NetworkImpactDisplay'],desc:'构建完整财务模型：收入分层、交叉验证、事件标注、燃料敏感性、网络影响。输出 NPV/IRR/DSCR 等核心指标。'},
    {num:7,title:'投资决策',en:'Investment Decision',color:'#C2410C',modules:['综合结论输出'],desc:'汇总所有分析结果，输出最终投资建议：Go/No-Go 决策、最优容量配置、预期回报区间、风险边界。'}
  ];
  const wemStages=[
    {num:'W1',title:'WEM 市场扫描',en:'WEM Market Screening',color:'#C2410C',modules:['PriceChartModule (WEM)','SummaryStatsModule','StemBalancingSpread'],desc:'WEM 单区域市场扫描，30分钟结算粒度。STEM 价差分析和平衡机制评估。'},
    {num:'W2',title:'ESS 与容量信用',en:'ESS & Capacity Credits',color:'#EA580C',modules:['CapacityCreditsAnalysis','FiveMinSettlementImpact'],desc:'评估 WEM ESS 机制下的容量信用收入，以及向 5 分钟结算过渡的影响。'},
    {num:'W3',title:'WEM 投资决策',en:'WEM Investment Decision',color:'#DC2626',modules:['综合结论输出'],desc:'WEM 特有的投资评估流程，合并了 Stage 4-6 的简化版本。'}
  ];

  const FunnelStep=({stage})=>(
    <div style={{marginBottom:8}}>
      <div onClick={()=>toggle(stage.num)} style={{display:'flex',alignItems:'center',gap:14,padding:'12px 18px',background:'#fff',border:'1px solid #E2E8F0',borderRadius:10,cursor:'pointer',borderLeft:'4px solid '+stage.color,transition:'box-shadow 0.2s'}}>
        <div style={{width:32,height:32,borderRadius:8,background:stage.color,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700,flexShrink:0}}>{stage.num}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:'#0F172A'}}>{stage.title}</div>
          <div style={{fontSize:11,color:'#94A3B8'}}>{stage.en}</div>
        </div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {stage.modules.map((m,i)=><span key={i} style={{padding:'2px 8px',background:stage.color+'11',border:'1px solid '+stage.color+'33',borderRadius:4,fontSize:11,color:stage.color,fontWeight:500}}>{m}</span>)}
        </div>
        <ChevronDown open={openStep===stage.num}/>
      </div>
      <div className={'expand-content '+(openStep===stage.num?'expanded':'collapsed')}>
        <div style={{padding:'10px 18px 10px 64px',fontSize:13,color:'#475569',lineHeight:1.7}}>{stage.desc}</div>
      </div>
    </div>
  );

      const top=el.offsetTop-48;
      window.scrollTo({top,behavior:'smooth'});
    }
  };
  return(
    <nav className="sticky-nav">
      <div className="nav-logo">
        <div className="nav-logo-dot"/>
        AEMO BESS 技术全景
      </div>
      {NAV_ITEMS.map(item=>(
        <a key={item.id} className={'nav-link'+(activeSection===item.id?' active':'')}
           onClick={()=>scrollTo(item.id)}>
          {item.num}. {item.label}
        </a>
      ))}
      <div className="nav-actions">
        <button className="nav-btn" onClick={onToggleAll}>
          {allExpanded?'全部收起':'全部展开'}
        </button>
      </div>
    </nav>
  );
};

/* ══════════════════════════════════════════════════
   Scroll Progress Bar
   ══════════════════════════════════════════════════ */
const ScrollProgress=()=>{
  const[width,setWidth]=useState(0);
  useEffect(()=>{
    const onScroll=()=>{
      const h=document.documentElement;
      const pct=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;
      setWidth(pct);
    };
    window.addEventListener('scroll',onScroll,{passive:true});
    return()=>window.removeEventListener('scroll',onScroll);
  },[]);
  return <div className="scroll-progress" style={{width:width+'%'}}/>;
};

/* ══════════════════════════════════════════════════
   App — 主入口
   ══════════════════════════════════════════════════ */

    return()=>window.removeEventListener('scroll',onScroll);

  return(
    <div className="diagram-root">

          <div className="header-meta-item"><div className="header-meta-dot" style={{background:'#3B82F6'}}/>NEM 蓝 · 5 区域 · 5 分钟结算</div>
          <div className="header-meta-item"><div className="header-meta-dot" style={{background:'#EA580C'}}/>WEM 橙 · 1 区域 · 30 分钟结算</div>
          <div className="header-meta-item"><div className="header-meta-dot" style={{background:'#10B981'}}/>Fingrid · 芬兰市场扩展</div>
          <div className="header-meta-item"><div className="header-meta-dot" style={{background:'#8B5CF6'}}/>27 Engines · 8 Algorithms</div>
        </div>
      </header>

      {/* Section 1 */}
      <Section num="1" title="业务逻辑链" titleEn="Truth → Forecast → Decision Pipeline" color={NEM_BLUE} id="sec-logic">
        <Section1/>

      {/* Section 2 */}
      <Section num="2" title="决策漏斗" titleEn="NEM 7-Stage & WEM 3-Stage Decision Funnel" color="#2563EB" id="sec-funnel">

      </Section>
      <div className="section-divider"/>

      {/* Section 3 */}
      <Section num="3" title="后端 27 引擎" titleEn="Backend Engine Architecture · 8 Categories" color="#7C3AED" id="sec-engines">

      </Section>

      <Section num="4" title="8 大核心算法" titleEn="Core Algorithms with Mathematical Formulations" color="#C2410C" id="sec-algos">

      <div className="info-footer">

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

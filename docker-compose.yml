services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      POSTGRES_DB: aemo_data
      POSTGRES_USER: aemo
      POSTGRES_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${PG_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aemo -d aemo_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    mem_limit: 1200m
    environment:
      AUS_ELE_DB_BACKEND: postgresql
      AUS_ELE_PG_HOST: postgres
      AUS_ELE_PG_PORT: 5432
      AUS_ELE_PG_DATABASE: aemo_data
      AUS_ELE_PG_USER: aemo
      AUS_ELE_PG_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
      AUS_ELE_PG_MAX_CONNECTIONS: 10
      AUS_ELE_ENABLE_SCHEDULER: ${AUS_ELE_ENABLE_SCHEDULER:-false}
      AUS_ELE_ENABLE_JOB_WORKER: ${AUS_ELE_ENABLE_JOB_WORKER:-false}
      AUS_ELE_RECONCILIATION_ENABLED: ${AUS_ELE_RECONCILIATION_ENABLED:-false}
      AUS_ELE_CORS_ALLOW_ORIGINS: ${AUS_ELE_CORS_ALLOW_ORIGINS:-http://localhost:${WEB_HOST_PORT:-18080},http://127.0.0.1:${WEB_HOST_PORT:-18080}}
      AUS_ELE_CORS_ALLOW_CREDENTIALS: ${AUS_ELE_CORS_ALLOW_CREDENTIALS:-false}
      AUS_ELE_JWT_SECRET: ${AUS_ELE_JWT_SECRET:?AUS_ELE_JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FINGRID_BASE_URL: ${FINGRID_BASE_URL:-https://data.fingrid.fi/api}
      FINGRID_REQUEST_INTERVAL_SECONDS: ${FINGRID_REQUEST_INTERVAL_SECONDS:-6.5}
      FINGRID_TIMEOUT_SECONDS: ${FINGRID_TIMEOUT_SECONDS:-30}
      FINGRID_DEFAULT_BACKFILL_START: ${FINGRID_DEFAULT_BACKFILL_START:-2014-01-01T00:00:00Z}
      FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS: ${FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS:-30}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
      - ./reports:/app/reports
    ports:
      - "${API_HOST_PORT:-18085}:8085"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      AUS_ELE_DB_BACKEND: postgresql
      AUS_ELE_PG_HOST: postgres
      AUS_ELE_PG_PORT: 5432
      AUS_ELE_PG_DATABASE: aemo_data
      AUS_ELE_PG_USER: aemo
      AUS_ELE_PG_PASSWORD: ${AUS_ELE_PG_PASSWORD:?AUS_ELE_PG_PASSWORD is required}
      AUS_ELE_PG_MAX_CONNECTIONS: 10
      AUS_ELE_ENABLE_SCHEDULER: ${AUS_ELE_WORKER_ENABLE_SCHEDULER:-true}
      AUS_ELE_ENABLE_JOB_WORKER: ${AUS_ELE_WORKER_ENABLE_JOB_WORKER:-true}
      AUS_ELE_RECONCILIATION_ENABLED: ${AUS_ELE_RECONCILIATION_ENABLED:-false}
      AUS_ELE_CORS_ALLOW_ORIGINS: ${AUS_ELE_CORS_ALLOW_ORIGINS:-http://localhost:${WEB_HOST_PORT:-18080},http://127.0.0.1:${WEB_HOST_PORT:-18080}}
      AUS_ELE_CORS_ALLOW_CREDENTIALS: ${AUS_ELE_CORS_ALLOW_CREDENTIALS:-false}
      AUS_ELE_JWT_SECRET: ${AUS_ELE_JWT_SECRET:?AUS_ELE_JWT_SECRET is required}
      REDIS_URL: redis://redis:6379/0
      FINGRID_API_KEY: ${FINGRID_API_KEY:-}
      FINGRID_BASE_URL: ${FINGRID_BASE_URL:-https://data.fingrid.fi/api}
      FINGRID_REQUEST_INTERVAL_SECONDS: ${FINGRID_REQUEST_INTERVAL_SECONDS:-6.5}
      FINGRID_TIMEOUT_SECONDS: ${FINGRID_TIMEOUT_SECONDS:-30}
      FINGRID_DEFAULT_BACKFILL_START: ${FINGRID_DEFAULT_BACKFILL_START:-2014-01-01T00:00:00Z}
      FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS: ${FINGRID_DEFAULT_INCREMENTAL_LOOKBACK_DAYS:-30}
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./data_lake:/app/data_lake
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        # 前端 feature flag（R5.4）。VITE_* 只在构建期生效，所以运维要能拧动它们就必须
        # 出现在这里；默认值一律「关」，与 web/src/lib/flags.js 的注册表逐条对齐
        # （flagsGuard.test.js 最后一道断言会检查这条链）。
        VITE_DATA_RIGHTS_UI: ${VITE_DATA_RIGHTS_UI:-false}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_LEGAL_ENTITY_NAME: ${VITE_LEGAL_ENTITY_NAME:-}
        VITE_LEGAL_ABN: ${VITE_LEGAL_ABN:-}
        VITE_LEGAL_JURISDICTION: ${VITE_LEGAL_JURISDICTION:-}
        # 启用分析前：先改 /legal/dpa 第 4 条与 /legal/cookies 第 7 条的「未启用」表述。
        VITE_ANALYTICS_ENABLED: ${VITE_ANALYTICS_ENABLED:-false}
        VITE_ANALYTICS_SDK_URL: ${VITE_ANALYTICS_SDK_URL:-}
        VITE_ANALYTICS_TOKEN: ${VITE_ANALYTICS_TOKEN:-}
        VITE_ANALYTICS_HOST: ${VITE_ANALYTICS_HOST:-}
        VITE_ANALYTICS_SESSION_REPLAY: ${VITE_ANALYTICS_SESSION_REPLAY:-false}
        VITE_ANALYTICS_MASK_ALL_TEXT: ${VITE_ANALYTICS_MASK_ALL_TEXT:-false}
        VITE_ANALYTICS_MASK_ALL_INPUTS: ${VITE_ANALYTICS_MASK_ALL_INPUTS:-false}
        # R3 new UI (URL state mirror / SPA nav / cmd-K palette / mobile drawer).
        VITE_URL_STATE_UI: ${VITE_URL_STATE_UI:-false}
        VITE_SPA_NAV_UI: ${VITE_SPA_NAV_UI:-false}
        VITE_COMMAND_PALETTE_UI: ${VITE_COMMAND_PALETTE_UI:-false}
        VITE_MOBILE_NAV_UI: ${VITE_MOBILE_NAV_UI:-false}
    restart: unless-stopped
    mem_limit: 384m
    ports:
      - "${WEB_HOST_PORT:-18080}:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"

volumes:
  redis_data:
  pg_data:
